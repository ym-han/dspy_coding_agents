[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[project]
name = "codex-dspy"
version = "0.1.0"
description = "DSPy module for OpenAI Codex SDK - signature-driven agentic workflows"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dspy>=3.0.3",
]
authors = [
    { name = "Darin Kishore" }
]
keywords = ["dspy", "codex", "agents", "llm", "openai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pre-commit>=3.6.0",
    "hypothesis>=6.99.0",
]

[project.urls]
Homepage = "https://github.com/darinkishore/codex_dspy"
Repository = "https://github.com/darinkishore/codex_dspy"
Documentation = "https://github.com/darinkishore/codex_dspy#readme"

[tool.pytest.ini_options]
testpaths = ["src/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[tool.uv.build-backend]
# Include both the codex SDK and codex_dspy wrapper
module-root = "src"
module-name = ["codex", "codex_dspy"]
